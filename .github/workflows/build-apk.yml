name: Build Android APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare web assets
        run: |
          mkdir -p www
          cat > www/index.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumina Dubai</title></head><body style="font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0"><p>Loading Lumina Dubai…</p></body></html>
          EOF
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk LuminaDubai.apk
          ls -lh LuminaDubai.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminaDubai-apk
          path: LuminaDubai.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.0
          name: Lumina Dubai APK
          files: LuminaDubai.apk
          generate_release_notes: false
